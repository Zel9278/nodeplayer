[package]
name = "nodeplayer"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "sdk", "examples/plugin-example"]

[dependencies]
csynth = { git = "https://git.c30.life/ced/csynth-v2" }
alsa = "0.11"
anyhow = "1.0.104"
base64 = "0.22"
clap-sys = "0.5"
cpal = "0.18"
crossbeam-channel = "0.5.17"
eframe = "0.36"
egui = "0.36"
egui-snarl = "0.12"
egui_dock = { version = "0.21", features = ["serde"] }
env_logger = "0.11.11"
libc = "0.2.191"
libloading = "0.9"
memmap2 = "0.9.11"
zstd = { version = "0.13.3", default-features = false }
nodeplayer-plugin = { path = "sdk" }
log = "0.4.34"
pitch-detection = "0.3"
raw-window-handle = "0.6"
realfft = "3.5"
rfd = "0.17.2"
rtrb = "0.4"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
ring = "0.17"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
symphonia = { version = "0.6", features = ["all"] }
vst3 = "0.3"
winit = { version = "0.30", default-features = false, features = ["x11"] }
x11rb = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ab_glyph = "0.2"

[build-dependencies]
cmake = "0.1"

# As midi-blocks-rs: csynth and the MIDI file player are much faster this way.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
