[package]
name = "nodeplayer"
version = "0.1.0"
edition = "2024"
authors = ["Zel9278"]
license = "MIT"

[workspace]
members = [".", "sdk", "examples/plugin-example"]

[dependencies]
csynth = { git = "https://git.c30.life/ced/csynth-v2" }
anyhow = "1.0.104"
base64 = "0.22"
clap-sys = "0.5"
cpal = "0.18"
crossbeam-channel = "0.5.17"
eframe = "0.36"
egui = "0.36"
egui-snarl = "0.12"
egui_dock = { version = "0.21", features = ["serde"] }
env_logger = "0.11.11"
libc = "0.2.191"
libloading = "0.9"
memmap2 = "0.9.11"
zstd = { version = "0.13.3", default-features = false }
nodeplayer-plugin = { path = "sdk" }
log = "0.4.34"
pitch-detection = "0.3"
raw-window-handle = "0.6"
realfft = "3.5"
rfd = "0.17.2"
rtrb = "0.4"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
ring = "0.17"
symphonia = { version = "0.6", features = ["all"] }
vst3 = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ab_glyph = "0.2"
# FFmpeg's Windows builds come as zip files.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Linux: ALSA for audio and MIDI, X11 for plugin editor windows, MPRIS over D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
winit = { version = "0.30", default-features = false, features = ["x11"] }
x11rb = "0.14"

# Windows: WASAPI through cpal, WinMM for MIDI, HWND for plugin editors, SMTC for the
# media session.
[target.'cfg(target_os = "windows")'.dependencies]
midir = "0.11"
souvlaki = "0.8"
winit = "0.30"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS: CoreAudio through cpal, CoreMIDI, Now Playing for the media session.
[target.'cfg(target_os = "macos")'.dependencies]
midir = "0.11"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSGraphics", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
souvlaki = "0.8"
winit = "0.30"

[build-dependencies]
cmake = "0.1"

# As midi-blocks-rs: csynth and the MIDI file player are much faster this way.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# winit 0.30.13 with one fix: on X11 a window that already has the focus got no IME input
# once a text field asked for it (see `ImeRequest::Allow` in its x11/event_processor.rs).
[patch.crates-io]
winit = { path = "third_party/winit" }
