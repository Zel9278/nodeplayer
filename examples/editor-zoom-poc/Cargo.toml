[package]
name = "nodeplayer-editor-zoom-poc"
version = "0.1.0"
edition = "2024"
publish = false

# An isolated experiment: building this does not build nodeplayer's audio engine.
[workspace]

[dependencies]
anyhow = "1"
clap-sys = "0.5"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11"] }
egui = "0.36.2"
image = { version = "0.25", default-features = false, features = ["png"] }
libloading = "0.9"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11rb = { version = "0.14", features = ["composite", "damage", "xtest"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSButton", "NSColor", "NSControl", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSGeometry", "NSRunLoop", "NSString"] }
