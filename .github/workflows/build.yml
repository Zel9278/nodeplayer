# Release builds for Linux, Windows and macOS (Apple silicon and Intel), kept as artifacts.
# A pushed v* tag also publishes them as a GitHub release: a draft is made first, each build
# uploads its own archive to it, and it is published once all are there. The release doesn't
# go through artifact storage, so a full artifact quota can't stop it.
# Windows is cross-built with MinGW on Linux, the same way as locally; its C++ runtime is
# linked in statically (see build.rs), so the .exe runs on its own.

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "nodeplayer $GITHUB_REF_NAME" --generate-notes

  build:
    name: ${{ matrix.name }}
    needs: draft
    # Runs also when there is no draft (branch pushes skip it).
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe: nodeplayer
            test: true
            package: linux-x86_64
          - name: Windows x86_64
            os: ubuntu-24.04
            target: x86_64-pc-windows-gnu
            exe: nodeplayer.exe
            test: false
            package: windows-x86_64
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: nodeplayer
            test: true
            package: macos-arm64
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            exe: nodeplayer
            test: false
            package: macos-x86_64
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux packages
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libasound2-dev libfontconfig1-dev libfreetype-dev \
            libx11-dev libxkbcommon-dev libdbus-1-dev

      - name: MinGW
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          # The posix flavour: ysfx uses std::thread and std::mutex.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Kept a week; a full artifact quota doesn't fail the build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: nodeplayer-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 7

      - name: Test
        if: matrix.test
        run: cargo test --release --locked --target ${{ matrix.target }}

      # The archive has the license and the README; .tar.gz keeps the executable bit.
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="nodeplayer-${GITHUB_REF_NAME}-${{ matrix.package }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" LICENSE README.md "$dir/"
          if [ "${{ matrix.package }}" = windows-x86_64 ]; then
            archive="$dir.zip"
            zip -qr "$archive" "$dir"
          else
            archive="$dir.tar.gz"
            tar -czf "$archive" "$dir"
          fi
          gh release upload "$GITHUB_REF_NAME" "$archive" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
