name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  draft:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "nodeplayer $GITHUB_REF_NAME" --generate-notes

  build:
    name: ${{ matrix.name }}
    needs: draft
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            runtime: linux-x64
            exe: nodeplayer
            test: true
          - name: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            runtime: win-x64
            exe: nodeplayer.exe
            test: true
          - name: macOS arm64 (osxcross)
            os: ubuntu-24.04
            target: aarch64-apple-darwin
            runtime: osx-arm64
            exe: nodeplayer
            cross: true
            test: false
          - name: macOS x86_64 (osxcross)
            os: ubuntu-24.04
            target: x86_64-apple-darwin
            runtime: osx-x64
            exe: nodeplayer
            cross: true
            test: false
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-dotnet@v4
        if: ${{ !matrix.cross }}
        with:
          dotnet-version: '8.0.x'
      - name: Linux packages
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libasound2-dev libfontconfig1-dev libfreetype-dev \
            libx11-dev libxkbcommon-dev libdbus-1-dev libfuse2t64 squashfs-tools
      - uses: mbround18/setup-osxcross@v3
        if: matrix.cross
        with:
          osx-version: '14.5'
      - name: Configure native dependencies for osxcross
        if: matrix.cross
        shell: bash
        run: bash packaging/macos/configure-osxcross.sh '${{ matrix.target }}'
      - name: Windows assembler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed.' }
          Join-Path $env:ProgramFiles 'NASM' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Test
        if: matrix.test
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Package native build
        if: ${{ !matrix.cross }}
        uses: ./.github/actions/package
        with:
          target: ${{ matrix.target }}
          runtime: ${{ matrix.runtime }}
          exe: ${{ matrix.exe }}
      - name: Stage macOS binaries and compiled tests
        if: matrix.cross
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          stage="target/cross/$RUNTIME"
          mkdir -p "$stage/tests"
          cp "target/$TARGET/release/nodeplayer" "$stage/nodeplayer"
          cargo test --release --locked --target "$TARGET" --no-run --message-format=json > target/cross-tests.json
          jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable' target/cross-tests.json |
            while IFS= read -r test; do cp "$test" "$stage/tests/"; done
          test -n "$(find "$stage/tests" -type f -print -quit)"
          tar -czf "target/$RUNTIME-build.tar.gz" -C "$stage" .
      # Tag runs transfer via the draft release, avoiding the Actions artifact quota.
      - name: Upload macOS build to draft
        if: matrix.cross && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME: ${{ matrix.runtime }}
        run: gh release upload "$GITHUB_REF_NAME" "target/$RUNTIME-build.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        if: matrix.cross && !startsWith(github.ref, 'refs/tags/v')
        with:
          name: cross-${{ matrix.runtime }}
          path: target/${{ matrix.runtime }}-build.tar.gz
          if-no-files-found: error
          retention-days: 1

  macos-package:
    name: Package and test ${{ matrix.runtime }}
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runtime: osx-arm64
          - target: x86_64-apple-darwin
            runtime: osx-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: cross-${{ matrix.runtime }}
          path: target/cross-download
      - name: Download macOS build from draft
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME: ${{ matrix.runtime }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$RUNTIME-build.tar.gz" --dir target/cross-download
      - name: Extract and test cross-built binaries
        env:
          TARGET: ${{ matrix.target }}
          RUNTIME: ${{ matrix.runtime }}
          CARGO_MANIFEST_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "target/$TARGET/release"
          tar -xzf "target/cross-download/$RUNTIME-build.tar.gz" -C "target/$TARGET/release"
          arch="$(uname -m)"
          if [[ "$RUNTIME" == osx-arm64 && "$arch" != arm64 ]]; then
            echo "::error::Apple Silicon is required to run arm64 tests."
            exit 1
          fi
          if [[ "$RUNTIME" == osx-x64 && "$arch" == arm64 ]]; then
            /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          for test in target/"$TARGET"/release/tests/*; do
            codesign --force --sign - "$test"
            "$test"
          done
      - name: Package cross-built app
        uses: ./.github/actions/package
        with:
          target: ${{ matrix.target }}
          runtime: ${{ matrix.runtime }}
          exe: nodeplayer
      - name: Remove intermediate build from draft
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME: ${{ matrix.runtime }}
        run: gh release delete-asset "$GITHUB_REF_NAME" "$RUNTIME-build.tar.gz" --repo "$GITHUB_REPOSITORY" --yes

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish draft after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
