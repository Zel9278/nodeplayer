name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  draft:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "nodeplayer $GITHUB_REF_NAME" --generate-notes

  build:
    name: ${{ matrix.name }}
    needs: draft
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            runtime: linux-x64
            exe: nodeplayer
            test: true
          - name: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            runtime: win-x64
            exe: nodeplayer.exe
            test: true
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            runtime: osx-arm64
            exe: nodeplayer
            test: true
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            runtime: osx-x64
            exe: nodeplayer
            test: false
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libasound2-dev libfontconfig1-dev libfreetype-dev \
            libx11-dev libxkbcommon-dev libdbus-1-dev libfuse2t64 squashfs-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Test
        if: matrix.test
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Restore pinned Velopack CLI
        run: dotnet tool restore
      - name: Download previous update package for deltas
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VPK_TOKEN: ${{ github.token }}
        run: |
          $names = gh release view --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the previous public release.' }
          if ($names -contains 'releases.${{ matrix.runtime }}.json') {
            dotnet tool run vpk -- --skip-updates --yes --legacyConsole download github --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --channel '${{ matrix.runtime }}' --outputDir 'target/velopack/${{ matrix.runtime }}'
            if ($LASTEXITCODE -ne 0) { throw 'Could not download the previous update package.' }
          }
      - name: Package installers and update feed
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $cargo = Get-Content Cargo.toml -Raw
            $version = [regex]::Match($cargo, '(?m)^version = "([^"]+)"').Groups[1].Value
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag and Cargo version differ.' }
          }
          ./packaging/velopack/package.ps1 -Binary 'target/${{ matrix.target }}/release/${{ matrix.exe }}' -Runtime '${{ matrix.runtime }}'
      - name: Test portable Windows update
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/velopack/test-update.ps1 -Binary 'target/${{ matrix.target }}/release/${{ matrix.exe }}'
      # Full artifact storage must not prevent publishing a tag release.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: nodeplayer-${{ matrix.runtime }}
          path: |
            target/velopack/${{ matrix.runtime }}/*.msi
            target/velopack/${{ matrix.runtime }}/*.exe
            target/velopack/${{ matrix.runtime }}/*.zip
            target/velopack/${{ matrix.runtime }}/*.pkg
            target/velopack/${{ matrix.runtime }}/*.AppImage
            target/velopack/${{ matrix.runtime }}/*.nupkg
            target/velopack/${{ matrix.runtime }}/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem 'target/velopack/${{ matrix.runtime }}' -File | Where-Object {
            $_.Extension -in @('.msi', '.exe', '.zip', '.pkg', '.AppImage', '.nupkg', '.json') -or $_.Name.StartsWith('RELEASES')
          }
          foreach ($file in $files) {
            gh release upload $env:GITHUB_REF_NAME $file.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not upload $($file.Name)." }
          }

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish draft after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
